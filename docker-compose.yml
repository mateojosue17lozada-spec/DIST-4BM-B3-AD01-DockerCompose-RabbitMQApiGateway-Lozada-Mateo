services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-pacientes-compose
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pacientes-network

  pacientes:
    build:
      context: ./Pacientes.Api
      dockerfile: Dockerfile
    container_name: pacientes-api-compose
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PacientesConnection: "Server=host.docker.internal,1433;Database=PacientesDB;User Id=usuario_pacientes;Password=1234;TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: admin
      RabbitMQ__Password: admin123
      RabbitMQ__QueueName: paciente_creado
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pacientes-network

  historial:
    build:
      context: ./Historial.Api
      dockerfile: Dockerfile
    container_name: historial-api-compose
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__HistorialConnection: "Server=host.docker.internal,1433;Database=HistorialDB;User Id=usuario_historial;Password=1234;TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: admin
      RabbitMQ__Password: admin123
      RabbitMQ__QueueName: paciente_creado
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pacientes-network

  apigateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway-pacientes-compose
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Routes__PacientesRoute__ClusterId: "PacientesCluster"
      ReverseProxy__Routes__PacientesRoute__Match__Path: "/api/Pacientes/{**catch-all}"
      ReverseProxy__Routes__HistorialRoute__ClusterId: "HistorialCluster"
      ReverseProxy__Routes__HistorialRoute__Match__Path: "/api/Historial/{**catch-all}"
      ReverseProxy__Clusters__PacientesCluster__Destinations__pacientesDestination__Address: "http://pacientes:8080/"
      ReverseProxy__Clusters__HistorialCluster__Destinations__historialDestination__Address: "http://historial:8080/"
    depends_on:
      pacientes:
        condition: service_started
      historial:
        condition: service_started
    networks:
      - pacientes-network

networks:
  pacientes-network:
    driver: bridge
